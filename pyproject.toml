[build-system]
requires = ["uv_build==0.13.9"]
build-backend = "uv_build"

[project]
name = "echo-audit"
version = "0.1.0.dev0"
description = "Audit audio datasets for shared recordings across model splits."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "scipy>=1.15,<2",
    "soundfile>=0.13,<1",
]

[project.scripts]
echo-audit = "echo.cli:main"

[dependency-groups]
benchmark = [
    "imageio-ffmpeg>=0.6,<1",
]
experiment = [
    "torch==2.12.1",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]
demo = [
    "matplotlib==3.10.9",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.build-backend]
module-name = "echo"

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
