name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"
      - name: Install locked environment
        run: uv sync --locked --group benchmark --group experiment --group demo
      - name: Check formatting
        run: uv run --no-sync ruff format --check src tests scripts
      - name: Lint
        run: uv run --no-sync ruff check src tests scripts
      - name: Run tests
        run: uv run --no-sync pytest
      - name: Run fixture smoke workflow
        run: |
          uv run --no-sync echo-audit --version
          uv run --no-sync echo-audit fixture --out "$RUNNER_TEMP/echo-fixture"
          uv run --no-sync echo-audit audio "$RUNNER_TEMP/echo-fixture/query.wav" --target-rate 12000
          uv run --no-sync echo-audit index "$RUNNER_TEMP/echo-fixture/index.csv" --out "$RUNNER_TEMP/echo.sqlite"
          uv run --no-sync echo-audit match "$RUNNER_TEMP/echo-fixture/query.wav" --index "$RUNNER_TEMP/echo.sqlite" --json > "$RUNNER_TEMP/echo-match.json"
          uv run --no-sync python -c 'import json, sys; from pathlib import Path; match = json.loads(Path(sys.argv[1]).read_text()); assert match["status"] == "matched" and match["candidates"][0]["asset_id"] == "fixture:reference" and abs(match["candidates"][0]["offset_seconds"] - 0.75) <= 0.008' "$RUNNER_TEMP/echo-match.json"

      - name: Reproduce the public walkthrough and chart
        run: |
          uv run --no-sync python scripts/run_stage7.py --out "$RUNNER_TEMP/echo-delivery"
          test -s "$RUNNER_TEMP/echo-delivery/audit/review.html"
          test -s "$RUNNER_TEMP/echo-delivery/leakage-accuracy.svg"

      - name: Reproduce the fixture benchmark and check published evidence
        run: |
          uv run --no-sync echo-audit bench --profile fixture --out "$RUNNER_TEMP/echo-bench"
          uv run --no-sync echo-audit bundle "$RUNNER_TEMP/echo-bench" --out "$RUNNER_TEMP/echo-fixture.zip"
          uv run --no-sync echo-audit report "$RUNNER_TEMP/echo-fixture.zip" --out "$RUNNER_TEMP/echo-bench-report"
          uv run --no-sync echo-audit report . --check

      - name: Verify the real-data release case from saved audit results
        run: uv run --no-sync python scripts/run_stage9_case.py --check --out "$RUNNER_TEMP/echo-release-case"

      - name: Replay the interactive audio example and verify its recorded data
        run: uv run --no-sync python scripts/run_audio_lab.py --check --out "$RUNNER_TEMP/echo-audio-example"

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"
      - name: Install Python tools
        run: uv sync --locked
      - name: Build and install the optional native wheel
        run: |
          cargo fmt --check --manifest-path native/Cargo.toml
          uv tool run --from maturin==1.16.0 maturin build --release --locked --manifest-path native/Cargo.toml --interpreter .venv/bin/python --compatibility linux --out "$RUNNER_TEMP/echo-wheels"
          uv pip install --no-deps "$RUNNER_TEMP"/echo-wheels/*.whl
      - name: Verify native and Python result parity
        run: uv run --no-sync python -c 'import _echo_offsets' && uv run --no-sync pytest tests/test_native_offsets.py tests/test_matcher.py tests/test_stage6_profile.py

  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [python, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: audio-audit-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: examples/audio-audit
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
